version: '3.9'

# ──────────────────────────────────────────────────────────────
# Coding-Bingo  ·  Production stack
#   nginx  →  app (Node.js)  →  postgres (external via DATABASE_URL)
#                           →  redis   (in-process cache layer)
# ──────────────────────────────────────────────────────────────

services:

  # ── 1. Nginx reverse-proxy (public entry point) ─────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Serve pre-built static assets directly (bypass Node for static)
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - coding-bingo-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ── 2. Application server ────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Reuse BuildKit cache across CI runs
      cache_from:
        - type=local,src=/tmp/.buildx-cache
      cache_to:
        - type=local,dest=/tmp/.buildx-cache,mode=max
    restart: unless-stopped
    # NOT exposed to the host directly – only via Nginx
    expose:
      - "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      # ── DB pool ──────────────────────────────────────────────
      - PG_MAX_POOL=20
      - PG_IDLE_TIMEOUT=30000
      - PG_CONNECTION_TIMEOUT=15000
      # ── Redis ────────────────────────────────────────────────
      - REDIS_URL=redis://redis:6379
      # ── Rate-limits ──────────────────────────────────────────
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=5000
      - GAME_RATE_LIMIT_MAX=200
      # ── App ──────────────────────────────────────────────────
      - ADMIN_SECRET=${ADMIN_SECRET}
      - USE_ONLINE_COMPILER=false
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - coding-bingo-network
    healthcheck:
      test: ["CMD", "node", "-e",
             "require('http').get('http://localhost:8080/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # ── 3. Redis (in-memory distributed cache) ──────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
        --tcp-keepalive 60
        --hz 20
    expose:
      - "6379"
    networks:
      - coding-bingo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 160M

networks:
  coding-bingo-network:
    driver: bridge
