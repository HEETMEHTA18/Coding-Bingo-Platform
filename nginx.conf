# ─────────────────────────────────────────────────────────────
# Nginx – high-performance reverse proxy for Coding-Bingo
# ─────────────────────────────────────────────────────────────

worker_processes      auto;          # one worker per CPU core
worker_rlimit_nofile  65535;

events {
  worker_connections  4096;
  use                 epoll;
  multi_accept        on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ─────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time';

  access_log  /var/log/nginx/access.log main buffer=64k flush=5s;
  error_log   /var/log/nginx/error.log warn;

  # ── TCP tuning ───────────────────────────────────────────────
  sendfile            on;
  tcp_nopush          on;
  tcp_nodelay         on;
  keepalive_timeout   65;
  keepalive_requests  1000;
  types_hash_max_size 2048;
  server_tokens       off;            # hide Nginx version

  # ── Gzip compression ────────────────────────────────────────
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_buffers      16 8k;
  gzip_http_version 1.1;
  gzip_min_length   256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/x-javascript
    application/xml
    application/xml+rss
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;

  # ── Upstream: Node.js app ────────────────────────────────────
  upstream app_backend {
    ip_hash;                             # sticky sessions – same client → same worker
    server app:8080;
    keepalive 32;                      # reuse connections to Node.js
  }

  # ── Client body / buffer tuning ─────────────────────────────
  client_max_body_size      50m;
  client_body_buffer_size   128k;
  proxy_buffer_size         16k;
  proxy_buffers             8 16k;
  proxy_busy_buffers_size   32k;

  server {
    listen 80;
    server_name _;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options         "SAMEORIGIN"          always;
    add_header X-Content-Type-Options  "nosniff"             always;
    add_header X-XSS-Protection        "1; mode=block"       always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Static assets (served directly by Nginx, never hits Node) ─
    location /assets/ {
      root    /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
      gzip_static on;
    }

    # ── Favicon & manifest ────────────────────────────────────
    location ~* \.(ico|webmanifest|png|jpg|jpeg|gif|svg|woff2|woff|ttf)$ {
      root    /usr/share/nginx/html;
      expires 30d;
      add_header Cache-Control "public";
      access_log off;
    }

    # ── API routes → proxy to Node.js ────────────────────────
    location /api/ {
      proxy_pass         http://app_backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade          $http_upgrade;
      proxy_set_header   Connection       "upgrade";   # for SSE / WS
      proxy_set_header   Host             $host;
      proxy_set_header   X-Real-IP        $remote_addr;
      proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      # SSE needs longer timeouts
      proxy_read_timeout    300s;
      proxy_connect_timeout  10s;
      proxy_send_timeout     60s;

      # No caching for API
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── SPA fallback – return index.html for all other paths ──
    location / {
      root  /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;

      # HTML files should never be cached (SPA entry point)
      location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    0;
      }
    }

    # ── Health check (no logging) ─────────────────────────────
    location = /health {
      proxy_pass http://app_backend/api/health;
      access_log off;
    }
  }
}
